<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Watchly - Personalized Stremio &amp; Nuvio Recommendations{% endblock %}</title>
    <meta name="description"
        content="Catalog addon for Stremio and Nuvio that provides personalized movie and series recommendations based on your watch history.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/app/static/logo.png" type="image/png">
    <script>
        window.APP_HOST = "{{ app_host }}";
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        // One accent, defined as CSS variables on :root below, so the palette is
                        // swapped in one place.
                        accent: {
                            DEFAULT: 'rgb(var(--accent) / <alpha-value>)',
                            hover: 'rgb(var(--accent-hover) / <alpha-value>)',
                            soft: 'rgb(var(--accent-soft) / <alpha-value>)',
                            ink: 'rgb(var(--accent-ink) / <alpha-value>)',
                        },
                        surface: { DEFAULT: '#0f0f10', raised: '#161617', sunken: '#09090a' },
                        // Brand colours: Stremio's button purple from stremio.com; Nuvio's violet sampled
                        // from its logo (nuvio.tv has no flat brand colour). Nuvio needs dark text.
                        stremio: { DEFAULT: '#7b5bf5', hover: '#6a48ec', border: '#8f75f7' },
                        nuvio: { DEFAULT: '#b44ef4', hover: '#c26bf7', ink: '#14061f' },
                    },
                    animation: { 'fade-in': 'fadeIn 0.25s ease-out forwards' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .page-header { @apply mb-8; }
            .page-title { @apply text-2xl md:text-3xl font-semibold tracking-tight text-white; }
            .page-lead { @apply mt-2 max-w-3xl text-[15px] leading-relaxed text-neutral-300; }
            .group-title { @apply text-xs font-semibold uppercase tracking-wider text-neutral-400; }

            .card { @apply rounded-2xl border border-white/[0.08] bg-surface p-5 md:p-6; }
            .card-title { @apply text-[15px] font-semibold text-white; }
            .card-desc { @apply mt-1 text-sm leading-relaxed text-neutral-300; }

            .field-label { @apply mb-1.5 block text-sm font-medium text-neutral-200; }
            .field-hint { @apply mt-1.5 text-xs leading-relaxed text-neutral-400; }
            .field-hint a { @apply text-neutral-300 underline decoration-neutral-500 underline-offset-2 hover:text-white; }
            .input {
                @apply w-full rounded-xl border border-white/10 bg-surface-sunken px-3.5 py-2.5 text-sm text-white
                    placeholder:text-neutral-500 transition focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/30;
            }

            .btn {
                @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium transition
                    focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/60 disabled:cursor-not-allowed disabled:opacity-50;
            }
            .btn-lg { @apply px-5 py-3 text-[15px]; }
            .btn-primary { @apply bg-accent font-semibold text-accent-ink shadow-lg shadow-accent/10 hover:bg-accent-hover; }
            .btn-secondary { @apply border border-white/10 bg-white/[0.05] text-neutral-100 hover:bg-white/[0.09]; }
            .btn-ghost { @apply text-neutral-300 hover:bg-white/5 hover:text-white; }
            .btn-stremio { @apply bg-stremio font-semibold text-white shadow-lg shadow-stremio/10 hover:bg-stremio-hover; }
            .btn-nuvio { @apply bg-nuvio font-semibold text-nuvio-ink shadow-lg shadow-nuvio/10 hover:bg-nuvio-hover; }
            .btn-danger { @apply border border-red-500/25 bg-red-500/10 text-red-300 hover:bg-red-500/15; }
            .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-white/5 hover:text-white; }

            .badge { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium; }

            .step-item { @apply flex items-center gap-2 rounded-full px-2.5 py-1.5 text-sm font-medium text-neutral-400 transition hover:text-white; }
            .step-num {
                @apply flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-full border border-white/15 text-xs text-neutral-400 transition;
            }
            .step-item.active { @apply bg-white/[0.06] text-white; }
            .step-item.active .step-num { @apply border-accent bg-accent font-semibold text-accent-ink; }
            .step-item.done .step-num { @apply border-accent/40 bg-accent/15 text-accent-soft; }
            .step-sep { @apply h-px w-4 bg-white/10 lg:w-8; }
            .nav-item.disabled { @apply pointer-events-none cursor-not-allowed opacity-60; }
            /* Phones keep the stepper to numbers, with the current step's name. */
            @media (max-width: 639.98px) {
                .step-item .step-label { @apply hidden; }
                .step-item.active .step-label { @apply inline; }
            }
        }
    </style>
    <style>
        :root {
            /* Teal. Channels only, so Tailwind can apply opacity (bg-accent/15). */
            --accent: 45 212 191;
            --accent-hover: 94 234 212;
            --accent-soft: 153 246 228;
            --accent-ink: 4 32 28;
        }

        body { background-color: #050505; }

        ::selection { background: rgb(var(--accent) / 0.35); color: #ffffff; }
        input, textarea { caret-color: #ffffff; }

        /* Operator-supplied HTML (ANNOUNCEMENT_HTML): give its paragraphs and links a house style. */
        #announcement-content > * + * { margin-top: 0.5rem; }
        #announcement-content :is(p:first-child, strong, b) { color: #ffffff; }
        #announcement-content p:first-child { font-weight: 600; }
        #announcement-content a { color: rgb(var(--accent-soft)); text-decoration: underline; text-underline-offset: 3px; }
        #announcement-content a:hover { color: #ffffff; }

        /* Number input: hide native spinners; we provide custom +/- */
        input.stepper-input[type=number]::-webkit-outer-spin-button,
        input.stepper-input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input.stepper-input[type=number] { -moz-appearance: textfield; }

        #user-profile-chevron { transition: transform 200ms ease; }

        /* Custom tooltip styles */
        .tooltip-wrapper {
            position: relative;
            display: inline-block;
        }

        .custom-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.95);
            color: #e2e8f0;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
            transform: translateX(-50%) translateY(4px);
            min-width: 200px;
            max-width: 320px;
            white-space: normal;
            line-height: 1.4;
            word-wrap: break-word;
            hyphens: auto;
        }

        .custom-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(15, 23, 42, 0.95);
        }

        .tooltip-wrapper:hover .custom-tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Tooltip positioning for edge cases */
        .tooltip-wrapper.tooltip-right .custom-tooltip {
            left: auto;
            right: 0;
            transform: translateX(0) translateY(4px);
        }

        .tooltip-wrapper.tooltip-right:hover .custom-tooltip {
            transform: translateX(0) translateY(0);
        }

        .tooltip-wrapper.tooltip-right .custom-tooltip::after {
            left: auto;
            right: 12px;
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen text-neutral-100 font-sans antialiased overflow-x-hidden">
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
