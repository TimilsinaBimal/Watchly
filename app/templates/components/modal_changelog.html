<!-- Changelog Modal -->
<div id="changelog-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" id="changelog-backdrop"></div>

    <!-- Clicks outside the dialog fall through to the backdrop, which closes it. -->
    <div class="pointer-events-none absolute inset-0 flex items-center justify-center p-4">
        <div
            class="pointer-events-auto relative flex max-h-[85vh] w-full max-w-2xl animate-fade-in flex-col rounded-2xl border border-white/10 bg-surface-raised shadow-2xl shadow-black/50">
            <div class="flex items-center justify-between gap-4 border-b border-white/[0.07] px-5 py-4 md:px-6">
                <h3 class="text-lg font-semibold text-white">What's new</h3>
                <button type="button" id="close-changelog" class="icon-btn -mr-2" aria-label="Close">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="changelog-content" class="flex-1 overflow-y-auto px-5 py-5 text-sm leading-relaxed text-slate-300 md:px-6">
                <p class="text-slate-400">Loading&hellip;</p>
            </div>

            <div class="flex justify-end border-t border-white/[0.07] px-5 py-3 md:px-6">
                <a href="https://github.com/TimilsinaBimal/watchly/releases" target="_blank" rel="noopener"
                    class="btn btn-secondary">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                    </svg>
                    <span>Releases on GitHub</span>
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    /* The changelog HTML is server-rendered markdown; Tailwind's preflight
       strips heading and list styles, so restore them scoped to the modal. */
    #changelog-content h1 {
        display: none;
    }

    #changelog-content h2 {
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        margin: 1.75rem 0 0.25rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    #changelog-content h2:first-of-type {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
    }

    #changelog-content h3 {
        color: #c4b5fd;
        font-size: 0.8125rem;
        font-weight: 600;
        margin: 1rem 0 0.25rem;
    }

    #changelog-content ul {
        list-style: disc;
        padding-left: 1.25rem;
        margin: 0.25rem 0;
    }

    #changelog-content li {
        margin: 0.4rem 0;
    }

    #changelog-content li::marker {
        color: #64748b;
    }

    #changelog-content p {
        margin: 0.5rem 0;
    }

    #changelog-content a {
        color: #c4b5fd;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    #changelog-content code {
        background: rgba(255, 255, 255, 0.07);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        font-size: 0.9em;
        color: #e2e8f0;
    }
</style>
