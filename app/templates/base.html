<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Watchly - Personalized Stremio &amp; Nuvio Recommendations</title>
    <meta name="description"
        content="Catalog addon for Stremio and Nuvio that provides personalized movie and series recommendations based on your watch history.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/app/static/logo.png" type="image/png">
    <script>
        window.APP_HOST = "{{ app_host }}";
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        accent: { DEFAULT: '#8b5cf6', hover: '#7c3aed', soft: '#c4b5fd' },
                        surface: { DEFAULT: '#121318', raised: '#181a21', sunken: '#0c0d11' },
                        stremio: { DEFAULT: '#3b2667', hover: '#4e3286', border: '#573b94' },
                    },
                    animation: { 'fade-in': 'fadeIn 0.25s ease-out forwards' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .page-header { @apply mb-8; }
            .page-title { @apply text-2xl md:text-3xl font-semibold tracking-tight text-white; }
            .page-lead { @apply mt-2 max-w-2xl text-[15px] leading-relaxed text-slate-400; }
            .group-title { @apply text-xs font-semibold uppercase tracking-wider text-slate-500; }

            .card { @apply rounded-2xl border border-white/[0.07] bg-surface p-5 md:p-6; }
            .card-title { @apply text-[15px] font-semibold text-white; }
            .card-desc { @apply mt-1 text-sm leading-relaxed text-slate-400; }

            .field-label { @apply mb-1.5 block text-sm font-medium text-slate-200; }
            .field-hint { @apply mt-1.5 text-xs leading-relaxed text-slate-500; }
            .field-hint a { @apply text-slate-300 underline decoration-slate-600 underline-offset-2 hover:text-white; }
            .input {
                @apply w-full rounded-xl border border-white/10 bg-surface-sunken px-3.5 py-2.5 text-sm text-white
                    placeholder:text-slate-500 transition focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/30;
            }

            .btn {
                @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium transition
                    focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/60 disabled:cursor-not-allowed disabled:opacity-50;
            }
            .btn-lg { @apply px-5 py-3 text-[15px]; }
            .btn-primary { @apply bg-accent text-white shadow-lg shadow-accent/20 hover:bg-accent-hover; }
            .btn-secondary { @apply border border-white/10 bg-white/[0.05] text-slate-100 hover:bg-white/[0.09]; }
            .btn-ghost { @apply text-slate-300 hover:bg-white/5 hover:text-white; }
            .btn-danger { @apply border border-red-500/25 bg-red-500/10 text-red-300 hover:bg-red-500/15; }
            .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 transition hover:bg-white/5 hover:text-white; }

            .badge { @apply inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium; }

            .step-item { @apply flex items-center gap-2 rounded-full px-2.5 py-1.5 text-sm font-medium text-slate-400 transition hover:text-white; }
            .step-num {
                @apply flex h-6 w-6 flex-shrink-0 items-center justify-center rounded-full border border-white/15 text-xs text-slate-400 transition;
            }
            .step-item.active { @apply bg-white/[0.06] text-white; }
            .step-item.active .step-num { @apply border-accent bg-accent text-white; }
            .step-item.done .step-num { @apply border-accent/40 bg-accent/15 text-accent-soft; }
            .step-sep { @apply h-px w-4 bg-white/10 lg:w-8; }
            .nav-item.disabled { @apply pointer-events-none cursor-not-allowed opacity-40; }
            /* Phones keep the stepper to numbers, with the current step's name. */
            @media (max-width: 639.98px) {
                .step-item .step-label { @apply hidden; }
                .step-item.active .step-label { @apply inline; }
            }
        }
    </style>
    <style>
        body {
            background-color: #0b0c0f;
            background-image: radial-gradient(900px 480px at 50% -120px, rgba(139, 92, 246, 0.10), transparent 70%);
            background-repeat: no-repeat;
        }

        ::selection { background: rgba(139, 92, 246, 0.4); color: #ffffff; }
        input, textarea { caret-color: #ffffff; }

        #announcement-content a { color: #e5e7eb; text-decoration: underline; }
        #announcement-content a:hover { color: #ffffff; }

        /* Number input: hide native spinners; we provide custom +/- */
        input.stepper-input[type=number]::-webkit-outer-spin-button,
        input.stepper-input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input.stepper-input[type=number] { -moz-appearance: textfield; }

        #user-profile-chevron { transition: transform 200ms ease; }

        /* Custom tooltip styles */
        .tooltip-wrapper {
            position: relative;
            display: inline-block;
        }

        .custom-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.95);
            color: #e2e8f0;
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
            transform: translateX(-50%) translateY(4px);
            min-width: 200px;
            max-width: 320px;
            white-space: normal;
            line-height: 1.4;
            word-wrap: break-word;
            hyphens: auto;
        }

        .custom-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(15, 23, 42, 0.95);
        }

        .tooltip-wrapper:hover .custom-tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Tooltip positioning for edge cases */
        .tooltip-wrapper.tooltip-right .custom-tooltip {
            left: auto;
            right: 0;
            transform: translateX(0) translateY(4px);
        }

        .tooltip-wrapper.tooltip-right:hover .custom-tooltip {
            transform: translateX(0) translateY(0);
        }

        .tooltip-wrapper.tooltip-right .custom-tooltip::after {
            left: auto;
            right: 12px;
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 font-sans antialiased overflow-x-hidden">
    {% block content %}{% endblock %}

    <!-- Inject backend constants for frontend -->
    <script>
        // Default catalog configurations from backend
        window.DEFAULT_CATALOGS = {{ default_catalogs | tojson }};
        window.MAX_ITEM_ROWS = {{ max_item_rows | tojson }};
        window.YEAR_RANGE_DEFAULTS = {{ year_range_defaults | tojson }};

        // Placeholder that stands in for a saved API key the server won't send back
        window.STORED_SECRET = {{ stored_secret_sentinel | tojson }};

        // Genre constants from backend
        window.MOVIE_GENRES = {{ movie_genres | tojson }};
        window.SERIES_GENRES = {{ series_genres | tojson }};
    </script>
    <script type="module" src="/app/static/js/main.js"></script>
</body>
</html>
